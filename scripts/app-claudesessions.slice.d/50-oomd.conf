# Why this is a drop-in and not three more lines in the .slice file.
#
# Fedora ships /usr/lib/systemd/user/slice.d/10-oomd-per-slice-defaults.conf,
# which arms oomd on EVERY user slice at an 80% limit. Drop-ins override the
# unit fragment, so the same setting written into app-claudesessions.slice is
# silently ignored and `systemctl --user show` reports 80% no matter what the
# file says. A unit-specific drop-in is applied after a type-wide one, so this
# is the only spelling that actually takes.
#
# That is the same precedence rule that hid a broken CPUWeight for a week in
# September 2026, which is why bot/claude/cgroups.py checks the live cgroup
# files rather than trusting any unit file, including these.
#
# 70 against app.slice's 80: when a fleet of sessions is doing the stalling,
# oomd reaches this limit first and kills ONE session scope. If app.slice's
# 80% were reached first, the victim it picked could be this entire slice,
# which is every session at once, the exact outcome the split exists to
# prevent.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=70%
