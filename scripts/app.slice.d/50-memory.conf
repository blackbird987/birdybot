# A ceiling on the whole user application tree, so a leak cannot take the box.
#
# Install (user unit, no root needed, nothing has to restart):
#
#   mkdir -p ~/.config/systemd/user/app.slice.d
#   cp scripts/app.slice.d/50-memory.conf ~/.config/systemd/user/app.slice.d/
#   systemctl --user daemon-reload
#
# --- Why this exists ---
#
# On 2026-09-21 16:32 and again on 2026-09-23 02:07 the machine died, and
# neither time was it the bot. smartmoney-api.service leaked to 13.2 GB and
# then to 10.6 GB, and the kernel's *global* OOM killer fired:
#
#   oom-kill:constraint=CONSTRAINT_NONE, ..., global_oom, task=dotnet
#   Out of memory: Killed process 3861530 (dotnet) anon-rss:10655400kB
#
# CONSTRAINT_NONE is the word that matters. No cgroup limit was reached,
# because there was no cgroup limit to reach: app.slice and user@1000.service
# both read MemoryMax=infinity, and every desktop application under them ships
# uncapped. The machine ran out of physical memory with swap already at 100%,
# and a global OOM picks its victim from the whole task table with the desktop
# in scope.
#
# systemd-oomd was armed on app.slice at an 80% pressure limit throughout and
# did not save it, which is not a misconfiguration: oomd needs 20 seconds of
# sustained stall to act, and a runtime allocating gigabytes in seconds with
# no swap runway left reaches global OOM first. A pressure watchdog is a
# reaction; a ceiling is an invariant.
#
# --- What the two numbers do ---
#
# MemoryHigh throttles. Crossing it costs speed and nothing else: the kernel
# reclaims, which on this tree means evicting several gigabytes of page cache
# that is free to lose, and it gives oomd's pressure rule the sustained stall
# it needs to choose a victim deliberately.
#
# MemoryMax is the invariant. Reaching it means the kernel OOM-kills *inside
# app.slice* -- so the victim is an application, chosen from applications, and
# the machine stays up. That is the entire structural change, and it is the
# same reasoning as app-claudesessions.slice one level down: give the killer a
# correctly sized victim and the failure stops being everybody's.
#
# --- Why the desktop survives a kill in here ---
#
# The KDE shell is not in this slice. plasmashell, kwin and the rest run in
# session.slice, a sibling, so a cgroup OOM under app.slice cannot reach them.
# What app.slice holds is Chrome, Steam, Discord, Telegram, the bot and its
# sessions -- things whose death is an inconvenience, not a lost session.
#
# --- Sizing, measured on this machine (31.2 GiB total) ---
#
# Outside app.slice at a normal moment: session.slice 605 MB, system.slice
# 286 MB, kernel slab 1.7 GB, page tables 185 MB, the login scope 334 MB.
# Call it 3.1 GB, and 27G leaves 4.2 GiB of reserve above the hard cap.
#
# 25G soft is deliberately well above the tree's working set (18.8 GB anon
# when this was written) rather than snug against it. A soft ceiling set at
# the working set does not hold a cgroup there, it makes the kernel reclaim
# continuously to hold it there, and continuous reclaim is precisely the stall
# pressure oomd kills on -- the mistake this repo already made once with
# SESSION_MEM_HIGH_MB and documented in CLAUDE.md. The ceiling is here to
# catch a leak, and it must be invisible to a tree that is merely busy.
[Slice]
MemoryHigh=25G
MemoryMax=27G
